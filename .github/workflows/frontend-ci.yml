name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const report = JSON.parse(require("fs").readFileSync("/tmp/npm-audit.json", "utf8")); for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) console.log(JSON.stringify({name, severity: advisory.severity, direct: advisory.isDirect, range: advisory.range, fixAvailable: advisory.fixAvailable, via: advisory.via}, null, 2));'
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
