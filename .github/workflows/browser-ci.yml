name: Browser Contract CI

on:
  pull_request:
    paths:
      - "backend/vacancyx/services/browser_*.py"
      - "backend/vacancyx/services/browser_assist.py"
      - "tests/test_browser_assist*.py"
      - "pyproject.toml"
      - ".github/workflows/browser-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/vacancyx/services/browser_*.py"
      - "backend/vacancyx/services/browser_assist.py"
      - "tests/test_browser_assist*.py"
      - "pyproject.toml"
      - ".github/workflows/browser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,browser]"
      - name: Install Chromium and system dependencies
        run: playwright install --with-deps chromium
      - name: Run real Chromium browser contract
        run: pytest -q tests/test_browser_assist_real_browser.py
