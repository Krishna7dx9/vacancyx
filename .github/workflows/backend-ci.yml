name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0,<85" pip-audit
          pip-audit --skip-editable
      - name: Lint
        run: ruff check backend tests
      - name: Type check
        run: mypy backend
      - name: Test
        run: pytest
