[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "vacancyx"
version = "0.1.0"
description = "Local-first job discovery and application workflow platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "VacancyX contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.scripts]
vacancyx-worker = "vacancyx.worker:main"
vacancyx-apply-assist = "vacancyx.browser_assist_cli:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.48,<2.0",
]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vacancyx"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
